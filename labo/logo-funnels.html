<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo Funnels Club, banc d'essai</title>

    <!--
      Banc d'essai du logo Funnels Club.

      Hors de `apps/web` : Next ne le construit ni ne le sert.

      Le tracé est celui d'origine, angles vifs, sans arrondi. Trois effets s'y
      ajoutent, tous réglables dans le bloc `:root` :

        1. Le liseré tournant, repris des boutons principaux du site. Un cône
           de lumière tourne sous la carte ; un fond opaque rentré d'un pixel
           le masque partout sauf sur le bord. C'est cette bande d'un pixel qui
           fait tout l'effet.

        2. L'inclinaison au survol. La carte pivote vers le curseur : souris en
           haut à droite, ce coin s'éloigne et le coin opposé se rapproche.
           C'est la perspective qui donne le volume, pas l'ombre.

        3. La tache de lumière qui suit le curseur, pour que la surface se lise
           comme une matière et non comme un aplat.

      Tout est neutralisé sous `prefers-reduced-motion`.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* La carte */
        --taille: 260px;
        --rayon: 22%;
        --cut: 1px; /* épaisseur du liseré tournant */
        --vitesse: 3s;
        --lueur: #ffffff; /* couleur du cône tournant */

        /* L'inclinaison */
        --angle-max: 14deg;
        --perspective: 700px;

        /* La tache de lumière */
        --tache-taille: 55%;
        --tache-force: 0.16;

        /* La page */
        --page: #f2ede4;
        --encre: #675c57;
        --encre-forte: #2b2118;
        --ombre-page: 0 22px 45px rgb(43 33 24 / 0.3);
        color-scheme: light;
      }

      html.sombre {
        --page: #0e0e11;
        --encre: #90909d;
        --encre-forte: #f2f2f5;
        --ombre-page: 0 22px 45px rgb(0 0 0 / 0.65);
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 2.5rem;
        padding: 3rem 1.5rem;
        background: var(--page);
        font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
        color: var(--encre);
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      .bascule {
        appearance: none;
        cursor: pointer;
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        padding: 0.55rem 1.1rem;
        border-radius: 5px;
        border: 1px solid color-mix(in srgb, var(--encre) 40%, transparent);
        background: transparent;
        color: var(--encre-forte);
      }
      .bascule:hover {
        background: color-mix(in srgb, var(--encre) 12%, transparent);
      }
      .bascule:focus-visible {
        outline: 2px solid #045ee6;
        outline-offset: 2px;
      }

      .aide {
        max-width: 30rem;
        text-align: center;
        font-size: 0.8125rem;
        line-height: 1.6;
      }

      /* ---------------------------------------------------------------
         La scène.

         La perspective se déclare sur le parent et non sur la carte : posée
         sur la carte elle-même, chaque face serait projetée depuis son propre
         point de fuite, et l'inclinaison paraîtrait plate.
      --------------------------------------------------------------- */
      .scene {
        perspective: var(--perspective);
      }

      /* La carte.

         `--rx` et `--ry` sont écrits par le script au survol. Au repos ils
         valent zéro, et la transition de 400 ms ramène la carte à plat sans
         à-coup quand la souris sort. */
      .logo {
        --rx: 0deg;
        --ry: 0deg;
        --tache-x: 50%;
        --tache-y: 50%;
        --tache-opacite: 0;

        position: relative;
        width: var(--taille);
        aspect-ratio: 1;
        border-radius: var(--rayon);
        display: grid;
        place-items: center;
        overflow: hidden;
        isolation: isolate;

        transform: rotateX(var(--rx)) rotateY(var(--ry));
        transform-style: preserve-3d;
        transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: var(--ombre-page);
      }

      /* 1. Le cône tournant, tout au fond.

         `@container` sur la carte donne l'unité `cqw` au balayage : le cône
         traverse exactement la largeur de la carte, quelle que soit sa
         taille. */
      .logo {
        container-type: size;
      }

      .cone {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: visible;
        filter: blur(2px);
      }
      .cone span {
        position: absolute;
        inset: 0;
        aspect-ratio: 1;
        height: 100cqh;
        animation: balayage var(--vitesse) ease-in-out infinite alternate;
      }
      .cone span span {
        position: absolute;
        inset: -100%;
        width: auto;
        height: auto;
        background: conic-gradient(
          from calc(270deg - 45deg),
          transparent 0,
          var(--lueur) 90deg,
          transparent 90deg
        );
        animation: rotation calc(var(--vitesse) * 2) linear infinite;
      }

      @keyframes balayage {
        to {
          transform: translate(calc(100cqw - 100%), 0);
        }
      }
      @keyframes rotation {
        0% {
          transform: translateZ(0) rotate(0);
        }
        15%,
        35% {
          transform: translateZ(0) rotate(90deg);
        }
        65%,
        85% {
          transform: translateZ(0) rotate(270deg);
        }
        100% {
          transform: translateZ(0) rotate(360deg);
        }
      }

      /* Le fond opaque, rentré de `--cut`. Il masque le cône partout sauf sur
         le liseré du bord : c'est lui qui transforme un disque lumineux en
         trait de lumière qui court le long du cadre. */
      .fond {
        position: absolute;
        inset: var(--cut);
        z-index: 1;
        border-radius: calc(var(--rayon) - 0.5px);
        background: linear-gradient(180deg, #17171a 0%, #08080a 100%);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.12),
          inset 0 -1px 0 rgb(0 0 0 / 0.9);
      }

      /* 3. La tache de lumière, au-dessus du fond mais sous la lettre. */
      .tache {
        position: absolute;
        inset: var(--cut);
        z-index: 2;
        border-radius: calc(var(--rayon) - 0.5px);
        pointer-events: none;
        opacity: var(--tache-opacite);
        transition: opacity 0.3s;
        background: radial-gradient(
          circle var(--tache-taille) at var(--tache-x) var(--tache-y),
          rgb(255 255 255 / var(--tache-force)) 0%,
          transparent 70%
        );
      }

      .logo svg {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        /* La lettre se soulève un peu au-dessus de la carte : c'est ce
           décalage en profondeur qui la fait bouger légèrement plus vite que
           le fond quand la carte pivote, et qui donne la sensation d'épaisseur. */
        transform: translateZ(18px);
        filter: drop-shadow(2px 4px 9px rgb(0 0 0 / 0.55));
      }
      .logo svg path {
        fill: url(#lumiere);
      }

      @media (prefers-reduced-motion: reduce) {
        .logo {
          transition: none;
          transform: none !important;
        }
        .cone span,
        .cone span span {
          animation: none;
        }
        .tache {
          opacity: 0 !important;
        }
      }
    </style>
  </head>

  <body>
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <defs>
        <linearGradient id="lumiere" x1="0.15" y1="0" x2="0.85" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="55%" stop-color="#f2f2f4" />
          <stop offset="100%" stop-color="#c9c9d2" />
        </linearGradient>
      </defs>
    </svg>

    <button type="button" class="bascule" id="bascule">
      Passer au thème sombre
    </button>

    <div class="scene">
      <div class="logo" id="logo">
        <div class="cone" aria-hidden="true"><span><span></span></span></div>
        <div class="fond" aria-hidden="true"></div>
        <div class="tache" aria-hidden="true"></div>

        <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Funnels Club">
          <path d="M231 240 H779 V404 H424 V458 H731 V629 H424 V760 H231 Z" />
        </svg>
      </div>
    </div>

    <p class="aide">
      Passez la souris sur le logo. Tout se règle dans le bloc
      <code>:root</code> en haut du fichier : <code>--angle-max</code> pour
      l'inclinaison, <code>--vitesse</code> pour le liseré,
      <code>--tache-force</code> pour la lumière.
    </p>

    <script>
      const logo = document.getElementById("logo");
      const douceur = window.matchMedia("(prefers-reduced-motion: reduce)");

      // L'angle maximal est lu dans la feuille de style, pour qu'il n'y ait
      // qu'un seul endroit à modifier.
      const angleMax = () =>
        parseFloat(
          getComputedStyle(logo).getPropertyValue("--angle-max")
        ) || 14;

      logo.addEventListener("pointermove", (e) => {
        if (douceur.matches) return;
        const r = logo.getBoundingClientRect();

        // Position du curseur ramenée à l'intervalle -0,5 à 0,5, l'origine au
        // centre de la carte.
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;

        // Le signe de `rotateX` est inversé : un curseur vers le bas doit
        // faire basculer le haut vers l'arrière, pas vers l'avant.
        logo.style.setProperty("--ry", `${x * angleMax() * 2}deg`);
        logo.style.setProperty("--rx", `${-y * angleMax() * 2}deg`);

        logo.style.setProperty("--tache-x", `${(x + 0.5) * 100}%`);
        logo.style.setProperty("--tache-y", `${(y + 0.5) * 100}%`);
        logo.style.setProperty("--tache-opacite", "1");
      });

      logo.addEventListener("pointerleave", () => {
        logo.style.setProperty("--rx", "0deg");
        logo.style.setProperty("--ry", "0deg");
        logo.style.setProperty("--tache-opacite", "0");
      });

      const bouton = document.getElementById("bascule");
      bouton.addEventListener("click", () => {
        const sombre = document.documentElement.classList.toggle("sombre");
        bouton.textContent = sombre
          ? "Passer au thème clair"
          : "Passer au thème sombre";
      });
    </script>
  </body>
</html>
