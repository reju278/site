<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo Funnels Club, banc d'essai</title>

    <!--
      Banc d'essai du logo Funnels Club.

      Hors de `apps/web` : Next ne le construit ni ne le sert.

      Le tracé est celui d'origine, angles vifs, sans arrondi. Trois effets s'y
      ajoutent, tous réglables dans le bloc `:root` :

        1. L'anneau lumineux qui suit la souris, repris de `magic-card`. Un
           halo radial est peint dans le `border-box`, la surface de la carte
           dans le `padding-box` : le halo n'apparaît donc que sur l'anneau
           d'un pixel et demi, et il court le long du cadre sous le curseur.

        2. L'inclinaison au survol. La carte pivote vers le curseur : souris en
           haut à droite, ce coin s'éloigne et le coin opposé se rapproche.
           C'est la perspective qui donne le volume, pas l'ombre.

        3. La tache de lumière qui suit le curseur, pour que la surface se lise
           comme une matière et non comme un aplat.

      L'anneau et la tache s'allument en 280 ms et s'éteignent en 450 : une
      lumière qui monte vite et redescend doucement paraît naturelle.

      Tout est neutralisé sous `prefers-reduced-motion`.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Une variable CSS ordinaire n'a pas de type : le navigateur ne sait pas
         ce qu'il y a entre « 0 » et « 1 », donc il saute de l'un à l'autre.
         `@property` lui donne ce type, et la valeur devient interpolable comme
         n'importe quelle longueur ou couleur.

         C'est la seule façon d'obtenir une apparition progressive ici : le halo
         vit dans une couche de `background`, et une couche de fond ne peut pas
         porter d'opacité propre. */
      @property --halo-force {
        syntax: "<number>";
        inherits: true;
        initial-value: 0;
      }

      :root {
        /* La carte */
        --taille: 260px;
        --rayon: 22%;
        --filet: 1.5px; /* épaisseur de l'anneau lumineux */
        --halo-taille: 190px; /* rayon du halo qui suit la souris */
        --halo: 4 94 230; /* le bleu de la marque */
        --halo-force: 0; /* monté à 1 au survol par le script */

        /* L'inclinaison */
        --angle-max: 14deg;
        --perspective: 700px;

        /* La tache de lumière */
        --tache-taille: 55%;
        --tache-force: 0.16;

        /* La page */
        --page: #f2ede4;
        --encre: #675c57;
        --encre-forte: #2b2118;
        --ombre-page: 0 22px 45px rgb(43 33 24 / 0.3);
        color-scheme: light;
      }

      html.sombre {
        --page: #0e0e11;
        --encre: #90909d;
        --encre-forte: #f2f2f5;
        --ombre-page: 0 22px 45px rgb(0 0 0 / 0.65);
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 2.5rem;
        padding: 3rem 1.5rem;
        background: var(--page);
        font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
        color: var(--encre);
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      .bascule {
        appearance: none;
        cursor: pointer;
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        padding: 0.55rem 1.1rem;
        border-radius: 5px;
        border: 1px solid color-mix(in srgb, var(--encre) 40%, transparent);
        background: transparent;
        color: var(--encre-forte);
      }
      .bascule:hover {
        background: color-mix(in srgb, var(--encre) 12%, transparent);
      }
      .bascule:focus-visible {
        outline: 2px solid #045ee6;
        outline-offset: 2px;
      }

      .aide {
        max-width: 30rem;
        text-align: center;
        font-size: 0.8125rem;
        line-height: 1.6;
      }

      /* ---------------------------------------------------------------
         La scène.

         La perspective se déclare sur le parent et non sur la carte : posée
         sur la carte elle-même, chaque face serait projetée depuis son propre
         point de fuite, et l'inclinaison paraîtrait plate.
      --------------------------------------------------------------- */
      .scene {
        perspective: var(--perspective);
      }

      /* La carte.

         `--rx` et `--ry` sont écrits par le script au survol. Au repos ils
         valent zéro, et la transition de 400 ms ramène la carte à plat sans
         à-coup quand la souris sort. */
      .logo {
        --rx: 0deg;
        --ry: 0deg;
        --tache-x: 50%;
        --tache-y: 50%;
        --tache-opacite: 0;

        position: relative;
        width: var(--taille);
        aspect-ratio: 1;
        border-radius: var(--rayon);
        display: grid;
        place-items: center;
        isolation: isolate;

        /* L'anneau lumineux, repris de `magic-card`.

           Deux couches de fond superposées. Celle du dessus est la surface de
           la carte, limitée au `padding-box`, donc elle s'arrête au bord
           intérieur de la bordure. Celle du dessous est un halo radial centré
           sur la souris, étendu au `border-box`. Le halo n'est donc visible
           que là où la surface ne le couvre pas : sur l'anneau d'un pixel et
           demi. C'est ce qui fait courir la lumière le long du cadre au lieu
           de l'étaler sur toute la carte.

           La bordure est transparente : sa seule fonction est de réserver
           l'épaisseur de l'anneau. */
        border: var(--filet) solid transparent;
        background:
          linear-gradient(180deg, #17171a 0%, #08080a 100%) padding-box,
          radial-gradient(
              var(--halo-taille) circle at var(--tache-x) var(--tache-y),
              rgb(var(--halo) / var(--halo-force)) 0%,
              rgb(var(--halo) / calc(var(--halo-force) * 0.35)) 45%,
              rgb(255 255 255 / calc(var(--halo-force) * 0.08)) 100%
            )
            border-box;
        /* Trois durées, trois rôles.

           La position de l'anneau n'est pas animée : elle suit la souris image
           par image, et une transition la ferait traîner derrière le curseur.
           C'est bien son **intensité** qui s'anime, et elle seule.

           L'extinction est plus lente que l'allumage, 450 contre 280 ms : une
           lumière qui s'allume vite et s'éteint doucement paraît naturelle,
           l'inverse paraît nerveux. */
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          --halo-force 0.45s ease-out;

        transform: rotateX(var(--rx)) rotateY(var(--ry));
        transform-style: preserve-3d;
        box-shadow: var(--ombre-page);
      }

      /* La tache de lumière sur la surface, au-dessus du fond mais sous la
         lettre. Elle partage `--tache-x` et `--tache-y` avec l'anneau : une
         seule position de souris, deux effets qui en découlent. */
      .tache {
        position: absolute;
        inset: 0;
        z-index: 2;
        border-radius: inherit;
        pointer-events: none;
        opacity: var(--tache-opacite);
        transition: opacity 0.45s ease-out;
        background: radial-gradient(
          circle var(--tache-taille) at var(--tache-x) var(--tache-y),
          rgb(255 255 255 / var(--tache-force)) 0%,
          transparent 70%
        );
      }

      .logo:hover {
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          --halo-force 0.28s ease-out;
      }

      .logo:hover .tache {
        transition: opacity 0.28s ease-out;
      }

      .logo svg {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        /* La lettre se soulève un peu au-dessus de la carte : c'est ce
           décalage en profondeur qui la fait bouger légèrement plus vite que
           le fond quand la carte pivote, et qui donne la sensation d'épaisseur. */
        transform: translateZ(18px);
        filter: drop-shadow(2px 4px 9px rgb(0 0 0 / 0.55));
      }
      .logo svg path {
        fill: url(#lumiere);
      }

      @media (prefers-reduced-motion: reduce) {
        .logo {
          transition: none;
          transform: none !important;
          --halo-force: 0 !important;
        }
        .tache {
          opacity: 0 !important;
        }
      }
    </style>
  </head>

  <body>
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <defs>
        <linearGradient id="lumiere" x1="0.15" y1="0" x2="0.85" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="55%" stop-color="#f2f2f4" />
          <stop offset="100%" stop-color="#c9c9d2" />
        </linearGradient>
      </defs>
    </svg>

    <button type="button" class="bascule" id="bascule">
      Passer au thème sombre
    </button>

    <div class="scene">
      <div class="logo" id="logo">
        <div class="tache" aria-hidden="true"></div>

        <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Funnels Club">
          <path d="M231 240 H779 V404 H424 V458 H731 V629 H424 V760 H231 Z" />
        </svg>
      </div>
    </div>

    <p class="aide">
      Passez la souris sur le logo. Tout se règle dans le bloc
      <code>:root</code> en haut du fichier : <code>--angle-max</code> pour
      l'inclinaison, <code>--halo-taille</code> et <code>--filet</code> pour
      l'anneau, <code>--tache-force</code> pour la lumière de surface.
    </p>

    <script>
      const logo = document.getElementById("logo");
      const douceur = window.matchMedia("(prefers-reduced-motion: reduce)");

      // L'angle maximal est lu dans la feuille de style, pour qu'il n'y ait
      // qu'un seul endroit à modifier.
      const angleMax = () =>
        parseFloat(
          getComputedStyle(logo).getPropertyValue("--angle-max")
        ) || 14;

      logo.addEventListener("pointermove", (e) => {
        if (douceur.matches) return;
        const r = logo.getBoundingClientRect();

        // Position du curseur ramenée à l'intervalle -0,5 à 0,5, l'origine au
        // centre de la carte.
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;

        // Le signe de `rotateX` est inversé : un curseur vers le bas doit
        // faire basculer le haut vers l'arrière, pas vers l'avant.
        logo.style.setProperty("--ry", `${x * angleMax() * 2}deg`);
        logo.style.setProperty("--rx", `${-y * angleMax() * 2}deg`);

        logo.style.setProperty("--tache-x", `${(x + 0.5) * 100}%`);
        logo.style.setProperty("--tache-y", `${(y + 0.5) * 100}%`);
        logo.style.setProperty("--tache-opacite", "1");
        logo.style.setProperty("--halo-force", "1");
      });

      logo.addEventListener("pointerleave", () => {
        logo.style.setProperty("--rx", "0deg");
        logo.style.setProperty("--ry", "0deg");
        logo.style.setProperty("--tache-opacite", "0");
        logo.style.setProperty("--halo-force", "0");
      });

      const bouton = document.getElementById("bascule");
      bouton.addEventListener("click", () => {
        const sombre = document.documentElement.classList.toggle("sombre");
        bouton.textContent = sombre
          ? "Passer au thème clair"
          : "Passer au thème sombre";
      });
    </script>
  </body>
</html>
